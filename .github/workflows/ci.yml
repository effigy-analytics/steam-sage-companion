name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go vet ./...
      - name: Allow test user namespaces on the ephemeral Ubuntu runner
        if: runner.os == 'Linux'
        # Ubuntu 24.04 AppArmor otherwise denies capabilities needed for uid_map.
        # Runtime-only on this disposable VM; tests still run as the runner user.
        # https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Linux isolated lifecycle and unit tests
        if: runner.os == 'Linux'
        run: scripts/with-isolated-network.sh go test -count=1 -v ./...
      - name: Windows unit tests
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: scripts/with-isolated-network.sh go test -race -count=1 -v ./...
      - run: go build ./cmd/steam-sage-companion
